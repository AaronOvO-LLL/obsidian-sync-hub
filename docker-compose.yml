name: obsidian-sync

# 注意：HTTPS/域名由宿主机的 Caddy（hao-rizon 边缘）统一负责，
# 本编排只跑 CouchDB，监听 127.0.0.1:5984，由边缘的站点块反代。
# 站点块见 deploy/sync-site-block.caddy（加入 hao-rizon-dashboard 仓库的 Caddyfile）。

services:
  couchdb:
    image: couchdb:3.5
    container_name: obsidian-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - couchdb-data:/opt/couchdb/data
    # 仅绑定本机回环，方便在服务器上直接运行 scripts/init.sh、curl 排障、访问 Fauxton。
    # 对外流量一律走宿主机 Caddy (HTTPS)。
    ports:
      - "127.0.0.1:5984:5984"

volumes:
  couchdb-data:
