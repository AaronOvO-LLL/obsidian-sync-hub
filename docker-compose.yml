name: obsidian-sync

services:
  couchdb:
    image: couchdb:3.5
    container_name: obsidian-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - couchdb-data:/opt/couchdb/data
    # 仅绑定本机回环，方便在服务器上直接运行 scripts/init.sh、curl 排障、访问 Fauxton。
    # 对外流量一律走 Caddy (HTTPS)。
    ports:
      - "127.0.0.1:5984:5984"
    networks:
      - sync-net

  caddy:
    image: caddy:2
    container_name: obsidian-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - couchdb
    networks:
      - sync-net

networks:
  sync-net:

volumes:
  couchdb-data:
  caddy-data:
  caddy-config:
